# Runs the `mix precommit` checks on every push to master and every pull
# request. The steps mirror the alias in mix.exs, except that `format` and
# `deps.unlock` run in their check modes: locally they fix files, here they
# must fail instead. Add a check to the alias, add it here too.
#
# One job, not one per check: each job would fetch and compile everything
# again, which costs more than the checks themselves.
name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test
  # Keep in step with .mise.toml.
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"

jobs:
  precommit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      - name: Restore deps and build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      # Dialyzer's core PLT (Erlang and Elixir) lives in MIX_HOME, not _build.
      - name: Restore Dialyzer core PLT
        uses: actions/cache@v6.1.0
        with:
          path: ~/.mix/dialyxir_*
          key: plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}

      - name: Deps and compile
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Lint
        run: |
          mix format --check-formatted
          mix deps.unlock --check-unused
          mix credo --strict
          mix ex_dna
          mix reach.check --arch

      - name: Dialyzer
        run: mix dialyzer

      - name: Test
        run: mix test
