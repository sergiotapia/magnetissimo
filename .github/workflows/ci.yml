# Runs the `mix precommit` checks on every push to master and every pull
# request, one job per group so each shows as its own check. The commands
# mirror the alias in mix.exs, except that `format` and `deps.unlock` run in
# their check modes: locally they fix files, here they must fail instead.
# Add a check to the alias, add it here too.
#
# compile goes first and saves the deps and _build cache that the other
# jobs, run in parallel after it, start from.
name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors

  lint:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix ex_dna
      - run: mix reach.check --arch

  dialyzer:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
      # The core PLT (Erlang and Elixir) lives in MIX_HOME and the deps PLT
      # in _build. Neither changes with the app's own code.
      - name: Restore PLTs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.mix/dialyxir_*
            _build/test/dialyxir_*
          key: plt-${{ runner.os }}-29.1.1-1.20.4-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-29.1.1-1.20.4
      - run: mix dialyzer

  test:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
      - run: mix test
